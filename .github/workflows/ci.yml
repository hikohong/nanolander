# Every change lands through an auto-merged PR, so this is the only thing
# standing between a broken script and main. Keep it fast and keep it honest
# about what it cannot reach — see tests/README.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # ShellCheck ships on the GitHub-hosted Ubuntu image, so normally there
      # is nothing to do. The apt fallback is for the day it stops shipping,
      # and it tolerates a failed update: apt-get update exits 100 when any
      # single repository on the runner is broken, and the image carries
      # third-party ones this job has nothing to do with. A Chrome index with
      # a hash mismatch took the whole job down with it.
      - name: Install ShellCheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version
            exit 0
          fi
          sudo apt-get update -qq || true
          sudo apt-get install -y shellcheck

      # -S style is stricter than the warning-level bar the README claims, and
      # the scripts are clean at it today. Any disable needs a comment saying why.
      # bin/* rather than a list of names: a helper added without being added
      # here would have gone unchecked, and helpers are meant to keep arriving.
      - name: ShellCheck
        run: shellcheck -S style bin/* tests/*.sh

      - name: Parse every script
        run: |
          for f in bin/* tests/*.sh; do
            bash -n "$f" || exit 1
          done

      # macOS still ships bash 3.2. These constructs would work on the runner
      # and fail there, which is the worst kind of breakage to ship.
      # The suites run on the macOS runner too, so they are held to the same
      # bar as the scripts they drive — a bash 4 construct in a test fails on
      # exactly the platform the test was meant to cover.
      - name: Reject bash 4+ constructs
        run: |
          if grep -nE 'declare -A|local -A|mapfile|readarray|\$\{[A-Za-z_]+,,|\$\{[A-Za-z_]+\^\^|\|&' \
               bin/* tests/*.sh \
             | grep -v '^\S*:[0-9]*:#'; then
            echo "bash 4+ construct found; macOS ships bash 3.2" >&2
            exit 1
          fi

      # The Neovim configuration is a third of this repository by line count
      # and nothing checked it: a typo in share/nvim/lua reached main and only
      # showed up as an error on the next editor start. Neovim runs LuaJIT,
      # whose syntax is 5.1, so lua5.1's compiler is the right parser — and it
      # is a 200 KB apt package rather than a Neovim build.
      #
      # A glob, not a list: the same reason ShellCheck takes bin/* above.
      - name: Install Lua 5.1
        run: |
          if command -v luac5.1 >/dev/null 2>&1; then
            luac5.1 -v
            exit 0
          fi
          sudo apt-get update -qq || true
          sudo apt-get install -y lua5.1

      - name: Parse every Lua file
        run: |
          found=0
          for f in $(find share -name '*.lua' | sort); do
            luac5.1 -p "$f" || exit 1
            found=$((found + 1))
          done
          # A find that matches nothing would otherwise pass this step in
          # silence, which is the failure mode this repository keeps hitting:
          # the check ran, the answer meant nothing was there, and nothing
          # asked which. Same rule as command_works.
          [ "$found" -gt 0 ] || { echo "no Lua files found to parse" >&2; exit 1; }
          echo "$found Lua files parse"

  test:
    name: Test suites
    runs-on: ${{ matrix.os }}
    # The whole set takes about ten seconds. Anything approaching this is a
    # hang, and the default is six hours of a runner sitting on it.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # No network, no root, no package installs: releases are local fixtures
      # served over file:// and everything writes into a throwaway HOME.
      - name: Run the suites
        run: ./tests/run.sh

  consistency:
    name: Docs match the catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The tool count lives in four places. They drift silently otherwise.
      - name: Tool count agrees everywhere
        run: |
          n=$(./bin/nanolander --list-tools | head -1 | grep -oE '[0-9]+ installable' | grep -oE '[0-9]+')
          echo "catalog: $n tools"
          readme=$(grep -cE '^\| \*\*' README.md)
          cards=$(grep -c '<div class="card">' docs/index.html)
          [ "$readme" = "$n" ] || { echo "README has $readme tool rows, catalog has $n" >&2; exit 1; }
          [ "$cards" = "$n" ]  || { echo "docs has $cards cards, catalog has $n" >&2; exit 1; }
          grep -q "| Tools installed | $n |" README.md || { echo "README summary table disagrees" >&2; exit 1; }
          grep -q "<b>$n</b>" docs/index.html || { echo "docs hero fact disagrees" >&2; exit 1; }
          grep -q ">$n tools<" docs/index.html || { echo "docs filter count disagrees" >&2; exit 1; }
          grep -q "'$n tools'" docs/index.html || { echo "docs JS reset disagrees" >&2; exit 1; }

      # The site is English only, and the scripts are too.
      # grep -P needs a UTF-8 locale for \x{...} and silently matches nothing
      # without one, so this is Python rather than grep.
      - name: No CJK outside a deliberate place
        run: |
          python3 - <<'PY'
          import pathlib, sys
          roots = ['README.md', 'CLAUDE.md', 'docs', 'bin', 'share', 'tests']
          bad = []
          for root in roots:
              p = pathlib.Path(root)
              files = [p] if p.is_file() else sorted(f for f in p.rglob('*') if f.is_file())
              for f in files:
                  try:
                      text = f.read_text(encoding='utf-8')
                  except (UnicodeDecodeError, OSError):
                      continue
                  hits = {c for c in text if '\u4e00' <= c <= '\u9fff' or '\u3000' <= c <= '\u303f'}
                  if hits:
                      bad.append(f"{f}: {''.join(sorted(hits))}")
          if bad:
              print('CJK in files that are English only:', *bad, sep='\n  ', file=sys.stderr)
              sys.exit(1)
          print('no CJK found')
          PY

      - name: Every docs card has an example
        run: |
          python3 - <<'PY'
          import re, sys
          s = open('docs/index.html', encoding='utf-8').read()
          sec = s[s.index('<section id="tools">'):s.index('<section id="how">')]
          cards = [c for c in re.split(r'(?=<div class="card">)', sec)
                   if c.startswith('<div class="card">')]
          bad = [c[:80] for c in cards if '<button class="run">' not in c]
          if bad:
              print('cards with no example button:', bad, file=sys.stderr)
              sys.exit(1)
          opens, closes = len(re.findall(r'<div\b', s)), len(re.findall(r'</div>', s))
          if opens != closes:
              print(f'div tags unbalanced: {opens} open, {closes} close', file=sys.stderr)
              sys.exit(1)
          print(f'{len(cards)} cards, div tags balanced')
          PY
